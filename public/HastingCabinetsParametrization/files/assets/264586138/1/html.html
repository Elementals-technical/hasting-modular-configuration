<div class="configurator-shell" data-model="Model A" data-material="Metal">
    <header class="configurator-header">
        <div class="configurator-title">
            <!-- <div class="configurator-title-badge">3D</div> -->
            <div class="configurator-title-text">
                <h1>Hasting</h1>
                <span>WebGL · Real-time product preview</span>
            </div>
        </div>
        <div class="configurator-status-pill">
            <span class="status-dot"></span>
            <span>Live preview</span>
        </div>
    </header>

    <main class="configurator-main">
        <!-- Ліва панель: моделі -->
        <aside class="side-panel side-panel--left">
            <div class="panel-label">
                <span>Models</span>
                <span>3</span>
            </div>
            <div class="chip-row" id="modelList">
                <button
            class=" button chip "
            data-model-id="OpenShelvesStatic"
          >
            <span>Open Shelves</span> 
          </button>
                <button
            class="button chip is-active"
            data-model-id="SideCabinetStatic"
          >
            <span>Side Cabinet</span> 
          </button>
                <button
            class="button chip"
            data-model-id="SinkBasesStatic"
          >
            <span>Sink Bases</span> 
          </button>
            </div>
        </aside>

        <!-- Права панель: матеріали -->
        <aside class="side-panel side-panel--right">
            <div class="panel-label">
                <span>Materials</span>
                <span>3</span>
            </div>

            <div class="material-swatches" id="materialList">
                <button
            class="swatch is-active"
            data-material-id="Metal Titanio"
          >
            <div class="swatch-inner">Metal Titanio</div>
          </button>

                <button
            class="swatch"
            data-material-id="Pulpis Scuro"
          >
            <div class="swatch-inner" data-material="wood">Pulpis Scuro</div>
          </button>

                <button
            class="swatch"
            data-material-id="Rovere Valdweg"
            >
            <div class="swatch-inner" data-material="matte">Rovere Valdweg</div>
          </button>


            </div>
        </aside>
    </main>
</div>
